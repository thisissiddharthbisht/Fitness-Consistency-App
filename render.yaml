# Render Blueprint — deploy the FastAPI backend from /backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fitness-consistency-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://fitness-consistency.vercel.app,https://fitness-progress-tracker.vercel.app
